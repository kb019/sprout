[package]
name = "sprout"
version = "0.1.0"
edition = "2024"

[lints.rust]
unused_imports = "warn"
dead_code = "warn"
unused_variables = "warn"

[lints.clippy]
unused-enumerate-index = "allow"
needless_pass_by_ref_mut = "warn"
implicit_clone = "warn"
vec_init_then_push = "allow"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
color-eyre = "0.6.5"
time = "0.3.55"
unicode-width = "0.2.0"
itertools = "0.14"
chrono = "0.4.45"
rusqlite = { version = "0.40.1", features = ["bundled"] }
dirs = "5"

[dev-dependencies]
rstest = "0.26"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
